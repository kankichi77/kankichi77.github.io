<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello you</title>
  <style>
    :root {
      --bg: #fff9d2;
      --ink: #1a2118;
      --muted: #5c6758;
      --accent: #0b6b3a;
      --line: rgba(26, 33, 24, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
    }

    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }

    header h1 {
      margin: 0 0 1.15rem;
      font-size: 1.45rem;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    .card {
      display: block;
      min-height: 4.5rem;
      padding: 0.9rem 1rem;
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 0.85rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 2px rgba(26, 33, 24, 0.06);
    }

    .card:hover,
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .meta strong {
      display: block;
      font-size: 1.05rem;
    }

    .meta span {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .card-hku { background: #eaf9ef; border-color: #c8efd6; }
    .card-math { background: #eaf3ff; border-color: #c9e0ff; }
    .card-typing { background: #ffeee6; border-color: #ffd4c2; }
    .card-learn { background: #faeaf8; border-color: #f3cff0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Hello you</h1>
    </header>

    <ul class="list">
      <li>
        <a class="card card-hku" href="hku/">
          <div class="meta">
            <strong>HKU Catering</strong>
            <span>Order from campus outlets</span>
          </div>
        </a>
      </li>
      <li>
        <a class="card card-math" href="math/">
          <div class="meta">
            <strong>Math</strong>
            <span>Papa's さんすうドリル</span>
          </div>
        </a>
      </li>
      <li>
        <a class="card card-typing" href="typing/">
          <div class="meta">
            <strong>Typing</strong>
            <span>Practice typing</span>
          </div>
        </a>
      </li>
      <li>
        <a class="card card-learn" href="learntocode/">
          <div class="meta">
            <strong>Learn to Code</strong>
            <span>A beginner HTML sample</span>
          </div>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
